name: CI - Motor Onitama

on: 
  push: 
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.x' 

    - name: Install dependencies and run tests
      working-directory: ./backend
      run: |
        npm install
        npx vitest run

    